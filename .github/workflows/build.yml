name: build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/sonata-arm64 ./cmd/sonata
